name: e2e

# Separate from `verify` for the same reason `bench` is: this drives a real
# browser against a real index, and a correctness suite people wait five
# minutes for is a suite they learn to skip.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packages/app-shell/**"
      - "packages/ui/**"
      - "apps/playground/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: bun install --frozen-lockfile
      # The playground serves the built app-shell, so an unbuilt workspace
      # would test the previous version of every screen.
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/playground/playwright-report/
          retention-days: 7
