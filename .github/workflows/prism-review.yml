# Dogfood the official Prism Review action on this repository (M-060).
name: prism-review

on:
  pull_request:
  push:
    branches: [main, "milestone/**"]

permissions:
  contents: read
  pull-requests: write
  # Needed when upload-sarif is enabled; harmless when false.
  security-events: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required by the action (and by `prism review --base`).
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install and build CLI from this workspace
        run: |
          bun install --frozen-lockfile
          bun run --filter @repo-prism/shared build
          bun run --filter @repo-prism/core build
          bun run --filter @repo-prism/cli build

      - name: Prism review
        uses: ./action
        with:
          # Dogfood the CLI just built from this checkout rather than npm latest.
          prism-command: node packages/cli/dist/cli.js
          fail-on: high
          # SARIF upload needs code scanning enabled on the repo; keep off for
          # dogfood until the owner turns that on. Local `--format sarif` is
          # still covered by CLI unit tests.
          upload-sarif: "false"
          comment: "true"
