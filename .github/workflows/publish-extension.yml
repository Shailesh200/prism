name: publish-extension

# Publishing is an explicit act: it fires only when a `repo-prism-v*` tag is pushed.
# Cut a release with: bump version -> commit -> tag repo-prism-vX.Y.Z -> push tag.
# Requires secrets: VSCE_PAT, OVSX_TOKEN
# Docs: packages/vscode-extension/PUBLISH.md

on:
  push:
    tags:
      - "repo-prism-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing repo-prism-v* tag to re-publish (recovery only)"
        required: true
        type: string

concurrency:
  group: publish-extension
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check publish secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          missing=0
          if [ -z "$VSCE_PAT" ]; then echo "::error::Missing secret VSCE_PAT"; missing=1; fi
          if [ -z "$OVSX_TOKEN" ]; then echo "::error::Missing secret OVSX_TOKEN"; missing=1; fi
          exit "$missing"

      # The tag is the release decision; package.json is the artifact's identity.
      # If they disagree, the release is ambiguous and must not proceed.
      - name: Resolve and verify version
        id: resolve
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${REF#repo-prism-v}"
          PKG_VERSION=$(node -p "require('./packages/vscode-extension/package.json').version")

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ${TAG_VERSION} does not match package.json version ${PKG_VERSION}."
            echo "::error::Bump the version and commit it before tagging."
            exit 1
          fi

          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Publishing RepoPrism ${PKG_VERSION} from ${REF}"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            platform: darwin
            arch: arm64
          - target: darwin-x64
            platform: darwin
            arch: x64
          - target: linux-x64
            platform: linux
            arch: x64
          - target: linux-arm64
            platform: linux
            arch: arm64
          - target: win32-x64
            platform: win32
            arch: x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - run: bun install --frozen-lockfile

      - name: Build + package ${{ matrix.target }}
        id: pkg
        env:
          PRISM_ELECTRON_VERSION: "40.10.3"
          PRISM_NATIVE_PLATFORM: ${{ matrix.platform }}
          PRISM_NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          cd packages/vscode-extension
          bun run scripts/package-vsix.ts --target "${{ matrix.target }}"
          VSIX="repo-prism-${VERSION}@${{ matrix.target }}.vsix"
          test -f "$VSIX"
          echo "vsix=packages/vscode-extension/${VSIX}" >> "$GITHUB_OUTPUT"

      - name: Publish ${{ matrix.target }} to VS Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          bunx @vscode/vsce publish \
            --packagePath "${{ steps.pkg.outputs.vsix }}" \
            -p "$VSCE_PAT"

      - name: Publish ${{ matrix.target }} to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          bunx ovsx publish "${{ steps.pkg.outputs.vsix }}" -p "$OVSX_TOKEN"

      - name: Summary
        run: |
          {
            echo "## RepoPrism ${{ needs.prepare.outputs.version }} (${{ matrix.target }})"
            echo ""
            echo "- Released from tag: ${{ needs.prepare.outputs.ref }}"
            echo "- VS Marketplace: https://marketplace.visualstudio.com/items?itemName=prismhq.repo-prism"
            echo "- Open VSX: https://open-vsx.org/extension/prismhq/repo-prism"
          } >> "$GITHUB_STEP_SUMMARY"
