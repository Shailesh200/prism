name: publish-extension

# Order: sync+bump → commit → package+publish per platform (native better-sqlite3)
# Requires secrets: VSCE_PAT, OVSX_TOKEN
# Docs: packages/vscode-extension/PUBLISH.md

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "bun.lock"
      - ".github/workflows/publish-extension.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump before publish"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: publish-extension
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Check publish secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          missing=0
          if [ -z "$VSCE_PAT" ]; then echo "::error::Missing secret VSCE_PAT"; missing=1; fi
          if [ -z "$OVSX_TOKEN" ]; then echo "::error::Missing secret OVSX_TOKEN"; missing=1; fi
          exit "$missing"

      - run: bun install --frozen-lockfile

      - name: Sync registries, bump version, commit
        id: bump
        env:
          LEFTHOOK: "0"
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          bun run packages/vscode-extension/scripts/bump-extension-version.ts "$BUMP"
          VERSION=$(node -p "require('./packages/vscode-extension/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/vscode-extension/package.json
          git commit -m "chore(extension): bump RepoPrism to ${VERSION} [skip ci]"
          git push origin HEAD:main

  publish:
    needs: bump
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            platform: darwin
            arch: arm64
          - target: darwin-x64
            platform: darwin
            arch: x64
          - target: linux-x64
            platform: linux
            arch: x64
          - target: linux-arm64
            platform: linux
            arch: arm64
          - target: win32-x64
            platform: win32
            arch: x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - run: bun install --frozen-lockfile

      - name: Build + package ${{ matrix.target }}
        id: pkg
        env:
          PRISM_ELECTRON_VERSION: "40.10.3"
          PRISM_NATIVE_PLATFORM: ${{ matrix.platform }}
          PRISM_NATIVE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.bump.outputs.version }}"
          cd packages/vscode-extension
          bun run scripts/package-vsix.ts --target "${{ matrix.target }}"
          VSIX="repo-prism-${VERSION}@${{ matrix.target }}.vsix"
          test -f "$VSIX"
          echo "vsix=packages/vscode-extension/${VSIX}" >> "$GITHUB_OUTPUT"

      - name: Publish ${{ matrix.target }} to VS Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          bunx @vscode/vsce publish \
            --packagePath "${{ steps.pkg.outputs.vsix }}" \
            -p "$VSCE_PAT"

      - name: Publish ${{ matrix.target }} to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          bunx ovsx publish "${{ steps.pkg.outputs.vsix }}" -p "$OVSX_TOKEN"

      - name: Summary
        run: |
          {
            echo "## RepoPrism ${{ needs.bump.outputs.version }} (${{ matrix.target }})"
            echo ""
            echo "- VS Marketplace: https://marketplace.visualstudio.com/items?itemName=prismhq.repo-prism"
            echo "- Open VSX: https://open-vsx.org/extension/prismhq/repo-prism"
          } >> "$GITHUB_STEP_SUMMARY"
