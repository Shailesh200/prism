name: verify

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:

jobs:
  verify:
    # Prism reads the filesystem and shells out to git, and both differ enough
    # between platforms to have caused real bugs — macOS resolving /var through
    # a symlink to /private/var broke workspace-relative path comparison, and
    # only a macOS run would have caught it.
    runs-on: ${{ matrix.os }}
    # Windows is advisory. Prism has never been run there (Q-011, deferred in
    # M-005) and path handling is the likely first casualty, so a required
    # Windows job would mean a permanently red matrix that people stop reading.
    # Reporting it without blocking gives the evidence needed to fix it.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # Several tests read real git history (authors, recent files, changed
          # paths). A shallow clone leaves them asserting on a single commit.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: bun install --frozen-lockfile
      - run: bun run verify:milestone

  # M-057 P-B9 — engines are >=22; keep a Node version matrix on the public
  # surfaces (core / cli / mcp) without re-running the full milestone suite.
  node-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      # Core/CLI/MCP import workspace packages; tests fail without dist.
      - name: Build dependency graph
        run: |
          set -euo pipefail
          for name in shared test-support analyzer graph-engine impact navigation indexer intelligence core ui mcp-server cli; do
            bun run --filter "@repo-prism/${name}" build
          done
      - run: bun run --filter @repo-prism/shared test
      - run: bun run --filter @repo-prism/core test
      - run: bun run --filter @repo-prism/cli test
      - run: bun run --filter @repo-prism/mcp-server test
      # The fixture-indexing and git suites (plan P22) run on every Node too.
      - run: bun run --filter @repo-prism/shared test:integration
      - run: bun run --filter @repo-prism/core test:integration
      - run: bun run --filter @repo-prism/mcp-server test:integration

  # 1.8.0 died on `import` (`formatDuration` missing from published shared)
  # before initialize. Source tests never saw it; this job loads dist.
  mcp-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: bun install --frozen-lockfile
      - name: Build MCP import graph
        run: |
          set -euo pipefail
          for name in shared test-support analyzer graph-engine impact navigation indexer intelligence core ui mcp-server; do
            bun run --filter "@repo-prism/${name}" build
          done
      - run: bun run scripts/check-publish-exports.mjs
      - run: bun run scripts/check-mcp-start.mjs

  # Plan P21 / B10 — install each host into an isolated HOME and run doctor.
  install-matrix:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: bun install --frozen-lockfile
      - name: Build install surface
        run: |
          set -euo pipefail
          for name in shared test-support analyzer graph-engine impact navigation indexer intelligence core ui mcp-server plugin daemon cli; do
            bun run --filter "@repo-prism/${name}" build
          done
      - name: B10 install matrix
        run: node scripts/bench/install-matrix.mjs --out "$RUNNER_TEMP/prism-b10"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: B10-install-matrix-${{ matrix.os }}
          path: ${{ runner.temp }}/prism-b10/B10-install-matrix.json

  # Plan P21 / ACT-2 — shallow clone must deepen without PRISM_SHALLOW on a reachable base.
  action-shallow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Deepen like the Action
        shell: bash
        env:
          BASE_REF: origin/main
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null || echo true)" = "true" ]; then
            git fetch --no-tags --deepen=200 origin || true
            git fetch --no-tags --depth=200 origin "${BASE_REF#origin/}" || true
          fi
          if ! git merge-base HEAD "${BASE_REF}" > /dev/null 2>&1; then
            echo "::error::PRISM_SHALLOW: base ${BASE_REF} unreachable after deepen"
            exit 1
          fi
          echo "ACT-2 deepen ok (merge-base reachable)"

