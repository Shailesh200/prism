name: publish-npm

# Publishing is an explicit act: it fires when a `prism-npm-v*` tag is pushed.
# Cut a release with: bump versions -> commit -> tag prism-npm-vX.Y.Z -> push tag.
# Requires secret: NPM_TOKEN (Automation token that can publish @repo-prism/*)

on:
  push:
    tags:
      - "prism-npm-v*"
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - name: Build publishable packages
        # Build bottom-up without moon. `mcp-server:build` depends on `^:build`,
        # and moon also schedules `cli:build`, which races `shared:build` and
        # fails in CI (`Cannot find module '@repo-prism/shared'`). Only dispatch
        # and mcp-server are new versions on this cut.
        run: |
          set -euo pipefail
          for name in shared test-support analyzer graph-engine impact navigation indexer intelligence repository-map core dispatch mcp-server; do
            bun run --filter "@repo-prism/${name}" build
          done

      - name: Check npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Missing secret NPM_TOKEN. Add an npm Automation token with publish access to @repo-prism, then re-run this workflow."
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run publish:npm
