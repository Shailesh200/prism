name: publish-npm

# Publishing is an explicit act: it fires when a `prism-npm-v*` tag is pushed.
# Cut a release with: bump versions -> commit -> tag prism-npm-vX.Y.Z -> push tag.
# Auth: npm trusted publishing (OIDC) first, then optional NPM_TOKEN.

on:
  push:
    tags:
      - "prism-npm-v*"
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm can use OIDC trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@11.5.2
          npm --version

      - run: bun install --frozen-lockfile

      - name: Build publishable packages
        # Build bottom-up without moon. `mcp-server:build` depends on `^:build`,
        # and moon also schedules `cli:build`, which races `shared:build` and
        # fails in CI (`Cannot find module '@repo-prism/shared'`).
        run: |
          set -euo pipefail
          for name in shared test-support analyzer graph-engine impact navigation indexer intelligence repository-map core dispatch mcp-server; do
            bun run --filter "@repo-prism/${name}" build
          done

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Publishing with NPM_TOKEN"
          else
            echo "No NPM_TOKEN; publishing with OIDC trusted publishing"
            unset NODE_AUTH_TOKEN
            # setup-node writes an empty _authToken that blocks OIDC fallback
            if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
              sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG}"
            fi
          fi
          bun run publish:npm
