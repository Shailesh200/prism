name: publish-npm

# A merge to main publishes npm when package code changed. A README, the docs,
# or the website alone does not. The website deploy is Vercel's, on the same
# push, and it builds only when apps/website or docs changed
# (apps/website/vercel.json). The two start together; neither waits for the other.
# A prism-npm-v* tag or a manual run publishes the same way.
# Auth: npm trusted publishing (OIDC) first, then optional NPM_TOKEN.

on:
  push:
    branches: [main]
    tags:
      - "prism-npm-v*"
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: gate
        run: |
          set -euo pipefail
          # A tag or a manual run is an explicit publish. A branch push
          # publishes only when package code changed.
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          decision=$(git diff --name-only "$before" "${{ github.sha }}" | node scripts/release-paths.mjs publish)
          echo "publish=${decision}" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Ensure npm can use OIDC trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@11.5.2
          npm --version

      - run: bun install --frozen-lockfile

      - name: Build publishable packages
        # Build bottom-up without moon. `mcp-server:build` depends on `^:build`,
        # and moon also schedules `cli:build`, which races `shared:build` and
        # fails in CI (`Cannot find module '@repo-prism/shared'`).
        #
        # This list is the build order: every package in the publish order of
        # scripts/publish-npm.mjs (which refuses a package without dist/), each
        # after its workspace dependencies. test-support is a dev dependency.
        run: |
          set -euo pipefail
          for name in shared test-support analyzer graph-engine impact navigation indexer intelligence core checks daemon mcp-server plugin cli; do
            bun run --filter "@repo-prism/${name}" build
          done

      - name: Refuse a publish without the token, cost and time proof (P14)
        # GATE-T1..T4: B1 ratio ≤ 1, B6 for Claude Code and opencode with
        # with-Prism ≤ without on tokens and cost, public repos only.
        run: node scripts/bench/release-gate.mjs

      - name: Refuse a publish that npm would not load
        # Catches "hub imports a name shared@already-published does not export".
        run: bun run scripts/check-publish-exports.mjs --against-npm

      - name: Refuse a publish whose MCP process cannot initialize
        run: bun run scripts/check-mcp-start.mjs

      - name: Publish to npm
        # OIDC only. setup-node's `registry-url` writes `_authToken` and injects
        # `github.token` as NODE_AUTH_TOKEN; npm then never exchanges the
        # id-token and fails with ENEEDAUTH. 1.8.0 published when the secret
        # was empty and the dummy line was stripped.
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG}"
          fi
          echo "Publishing with OIDC trusted publishing"
          bun run publish:npm
