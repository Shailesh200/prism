name: publish-npm

# Publishing is an explicit act: it fires when a `prism-npm-v*` tag is pushed.
# Cut a release with: bump versions -> commit -> tag prism-npm-vX.Y.Z -> push tag.
# Auth: npm trusted publishing (OIDC) first, then optional NPM_TOKEN.

on:
  push:
    tags:
      - "prism-npm-v*"
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Ensure npm can use OIDC trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@11.5.2
          npm --version

      - run: bun install --frozen-lockfile

      - name: Build publishable packages
        # Build bottom-up without moon. `mcp-server:build` depends on `^:build`,
        # and moon also schedules `cli:build`, which races `shared:build` and
        # fails in CI (`Cannot find module '@repo-prism/shared'`).
        #
        # This list is the build order and must stay a superset of the publish
        # order in scripts/publish-npm.mjs. Omitting dispatch-hub is what broke
        # 1.1.14 and 1.1.15; omitting host-session (and the UI packages it
        # typechecks against) is what broke 1.1.17.
        run: |
          set -euo pipefail
          for name in shared test-support analyzer graph-engine impact navigation indexer intelligence repository-map core ui app-shell host-session dispatch dispatch-hub mcp-server plugin; do
            bun run --filter "@repo-prism/${name}" build
          done

      - name: Refuse a publish that npm would not load
        # Catches "hub imports a name shared@already-published does not export".
        run: bun run scripts/check-publish-exports.mjs --against-npm

      - name: Refuse a publish whose MCP process cannot initialize
        run: bun run scripts/check-mcp-start.mjs

      - name: Publish to npm
        # OIDC only. setup-node's `registry-url` writes `_authToken` and injects
        # `github.token` as NODE_AUTH_TOKEN; npm then never exchanges the
        # id-token and fails with ENEEDAUTH. 1.8.0 published when the secret
        # was empty and the dummy line was stripped.
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
            sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG}"
          fi
          echo "Publishing with OIDC trusted publishing"
          bun run publish:npm
