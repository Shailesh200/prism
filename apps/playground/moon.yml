$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "application"
tasks:
  build:
    command: "bun run build"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "public/**/*"
    outputs:
      - "dist"
  typecheck:
    command: "bun run typecheck"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
  test:
    command: "bun run test"
    inputs:
      - "src/**/*"
      - "vitest.config.ts"
  test-integration:
    command: "bun run test:integration"
    inputs:
      - "src/**/*"
      - "vitest.integration.config.ts"
