$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "library"
dependsOn:
  - vscode-extension
toolchain:
  typescript:
    # Overlay only stages vscode-extension artifacts; that package is noEmit
    # and not composite — do not inject TS project references.
    syncProjectReferences: false
tasks:
  build:
    command: "bun run build"
    deps:
      - "vscode-extension:build"
    inputs:
      - "src/**/*"
      - "scripts/**/*"
      - "package.json"
      - "tsconfig.json"
    outputs:
      - "dist"
      - "media"
  typecheck:
    command: "bun run typecheck"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
  test:
    command: "bun run test"
    inputs:
      - "src/**/*"
      - "vitest.config.ts"
      - "package.json"
