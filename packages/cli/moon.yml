$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "library"
dependsOn:
  - "shared"
  - "core"
  - "daemon"
  # The CLI imports the server (`@repo-prism/mcp-server/review`) and ships the
  # server and the hook pack, so both build before it.
  - "mcp-server"
  - "plugin"
  - "test-support"
tasks:
  build:
    command: "bun run build"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "package.json"
    outputs:
      - "dist"
  typecheck:
    command: "bun run typecheck"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
  test:
    command: "bun run test"
    inputs:
      - "src/**/*"
      - "schemas/**/*"
      - "vitest.config.ts"
  test-integration:
    command: "bun run test:integration"
    # The cross-surface suite (moved here from mcp-server, round 4) spawns the
    # built `prism` binary, so this package's own build runs first.
    deps:
      - "build"
      - "test-support:build"
    inputs:
      - "src/**/*"
      - "vitest.integration.config.ts"
