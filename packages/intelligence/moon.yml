$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "library"
dependsOn:
  - "shared"
  - "graph-engine"
tasks:
  build:
    command: "bun run build"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "package.json"
    outputs:
      - "dist"
  typecheck:
    command: "bun run typecheck"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
  test:
    command: "bun run test"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "vitest.config.ts"
  test-integration:
    command: "bun run test:integration"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "vitest.integration.config.ts"
