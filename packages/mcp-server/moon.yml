$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "library"
dependsOn:
  - "shared"
  - "core"
  - "dispatch"
  - "test-support"
tasks:
  build:
    command: "bun run build"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "media/**/*"
      - "tsconfig.json"
      - "package.json"
    outputs:
      - "dist"
  typecheck:
    command: "bun run typecheck"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
  test:
    command: "bun run test"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "vitest.config.ts"
  test-integration:
    command: "bun run test:integration"
    # The cross-surface suite spawns the real `prism` binary, so the CLI has to
    # be built before this runs — otherwise the test fails with a missing file
    # and reads as a broken surface rather than a missing build step.
    deps:
      - "cli:build"
      - "test-support:build"
    inputs:
      - "src/**/*"
      - "vitest.integration.config.ts"
