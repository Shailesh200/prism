$schema: "https://moonrepo.dev/schemas/project.json"
language: "typescript"
layer: "library"
dependsOn:
  - "shared"
  - "checks"
  - "core"
  - "daemon"
  - "test-support"
tasks:
  build:
    command: "bun run build"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "media/**/*"
      - "tsconfig.json"
      - "package.json"
    outputs:
      - "dist"
  typecheck:
    command: "bun run typecheck"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
  test:
    command: "bun run test"
    deps:
      - "^:build"
    inputs:
      - "src/**/*"
      - "vitest.config.ts"
  test-integration:
    command: "bun run test:integration"
    # The cross-surface suite, which needs the built CLI, lives in the cli
    # package (round 4): depending on cli here made a cycle with cli → server.
    deps:
      - "^:build"
      - "test-support:build"
    inputs:
      - "src/**/*"
      - "vitest.integration.config.ts"
