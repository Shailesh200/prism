<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none" role="img" aria-label="Prism Repository Map mockup">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8EEF2"/>
      <stop offset="55%" stop-color="#F3F7F9"/>
      <stop offset="100%" stop-color="#EDF3F6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#C5D0D8" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F1C24" flood-opacity="0.06"/>
    </filter>
    <style>
      .sans { font-family: "Switzer", "Satoshi", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace; }
    </style>
  </defs>

  <!-- App background -->
  <rect width="1440" height="900" fill="url(#canvas)"/>
  <rect x="0" y="56" width="1440" height="844" fill="url(#grid)" opacity="0.55"/>

  <!-- Top chrome -->
  <rect width="1440" height="56" fill="#FBFCFD" stroke="#C5D0D8"/>
  <!-- Brand -->
  <circle cx="28" cy="28" r="8" fill="#0F766E"/>
  <path d="M24.5 28h7M28 24.5v7" stroke="#FBFCFD" stroke-width="1.5" stroke-linecap="round"/>
  <text x="46" y="34" class="sans" font-size="18" font-weight="600" fill="#0F1C24">Prism</text>

  <!-- Search -->
  <rect x="420" y="12" width="480" height="32" rx="8" fill="#FFFFFF" stroke="#C5D0D8"/>
  <circle cx="440" cy="28" r="5.5" stroke="#5A6B76" stroke-width="1.5" fill="none"/>
  <path d="M444 32l4 4" stroke="#5A6B76" stroke-width="1.5" stroke-linecap="round"/>
  <text x="456" y="33" class="sans" font-size="13" fill="#5A6B76">Find a feature or file…</text>

  <!-- Top actions -->
  <text x="1288" y="34" class="sans" font-size="13" font-weight="500" fill="#5A6B76">Views</text>
  <text x="1358" y="34" class="sans" font-size="13" font-weight="500" fill="#0F766E">Reindex</text>

  <!-- Map stage -->
  <rect x="24" y="80" width="1020" height="796" rx="12" fill="#F7FAFB" stroke="#C5D0D8" filter="url(#soft)"/>

  <!-- Hint chip -->
  <rect x="44" y="100" width="220" height="28" rx="8" fill="#FFFFFF" stroke="#C5D0D8"/>
  <text x="56" y="119" class="sans" font-size="12" fill="#5A6B76">Click a region to inspect</text>

  <!-- Dependency hints (very subtle) -->
  <path d="M280 360C360 300 420 260 520 240" stroke="#94A3B0" stroke-opacity="0.45" stroke-width="1.5" fill="none"/>
  <path d="M520 300C610 340 700 400 760 470" stroke="#94A3B0" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>
  <path d="M300 520C420 560 560 580 700 560" stroke="#94A3B0" stroke-opacity="0.3" stroke-width="1.5" fill="none"/>

  <!-- Feature regions -->
  <!-- Auth -->
  <rect x="80" y="180" width="220" height="150" rx="16" fill="#D9EDEC" stroke="#0F766E" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="100" y="214" class="sans" font-size="20" font-weight="600" fill="#0F1C24">Auth</text>
  <text x="100" y="238" class="sans" font-size="12" fill="#5A6B76">12 files</text>

  <!-- Billing (selected) -->
  <rect x="360" y="160" width="280" height="200" rx="16" fill="#CCE7E4" stroke="#0F766E" stroke-width="2.5"/>
  <text x="384" y="198" class="sans" font-size="22" font-weight="650" fill="#0F1C24">Billing</text>
  <text x="384" y="222" class="sans" font-size="12" fill="#5A6B76">Payments · invoices · webhooks</text>
  <circle cx="612" cy="188" r="5" fill="#0F766E"/>

  <!-- API -->
  <rect x="700" y="200" width="240" height="160" rx="16" fill="#E2E9EE" stroke="#8AA0AE" stroke-width="1.5"/>
  <text x="720" y="234" class="sans" font-size="20" font-weight="600" fill="#0F1C24">API</text>
  <text x="720" y="258" class="sans" font-size="12" fill="#5A6B76">18 files</text>

  <!-- UI -->
  <rect x="120" y="420" width="260" height="170" rx="16" fill="#E7EEF2" stroke="#8AA0AE" stroke-width="1.5"/>
  <text x="140" y="456" class="sans" font-size="20" font-weight="600" fill="#0F1C24">UI</text>
  <text x="140" y="480" class="sans" font-size="12" fill="#5A6B76">9 files</text>

  <!-- Data -->
  <rect x="460" y="440" width="300" height="180" rx="16" fill="#E5EDF1" stroke="#8AA0AE" stroke-width="1.5"/>
  <text x="480" y="478" class="sans" font-size="20" font-weight="600" fill="#0F1C24">Data</text>
  <text x="480" y="502" class="sans" font-size="12" fill="#5A6B76">14 files</text>

  <!-- Jobs -->
  <rect x="820" y="430" width="180" height="140" rx="16" fill="#E9F0F3" stroke="#8AA0AE" stroke-width="1.5"/>
  <text x="840" y="466" class="sans" font-size="20" font-weight="600" fill="#0F1C24">Jobs</text>
  <text x="840" y="490" class="sans" font-size="12" fill="#5A6B76">6 files</text>

  <!-- Zoom rail -->
  <g transform="translate(44 780)">
    <rect width="320" height="36" rx="8" fill="#FFFFFF" stroke="#C5D0D8"/>
    <text x="14" y="23" class="sans" font-size="11" fill="#5A6B76">Zoom</text>
    <text x="58" y="23" class="sans" font-size="11" font-weight="600" fill="#0F766E">Repo</text>
    <text x="100" y="23" class="sans" font-size="11" fill="#94A3B0">/</text>
    <text x="112" y="23" class="sans" font-size="11" fill="#5A6B76">Package</text>
    <text x="172" y="23" class="sans" font-size="11" fill="#94A3B0">/</text>
    <text x="184" y="23" class="sans" font-size="11" font-weight="600" fill="#0F1C24">Feature</text>
    <text x="244" y="23" class="sans" font-size="11" fill="#94A3B0">/</text>
    <text x="256" y="23" class="sans" font-size="11" fill="#5A6B76">File</text>
  </g>

  <!-- Inspector -->
  <rect x="1068" y="80" width="348" height="796" rx="12" fill="#FBFCFD" stroke="#C5D0D8" filter="url(#soft)"/>
  <text x="1092" y="120" class="sans" font-size="12" font-weight="500" fill="#5A6B76">SELECTED FEATURE</text>
  <text x="1092" y="152" class="sans" font-size="28" font-weight="650" fill="#0F1C24">Billing</text>
  <text x="1092" y="180" class="sans" font-size="13" fill="#5A6B76">Payments, invoices, and webhook handlers.</text>

  <line x1="1092" y1="204" x2="1388" y2="204" stroke="#C5D0D8"/>

  <text x="1092" y="236" class="sans" font-size="12" font-weight="600" fill="#0F1C24">Files in this feature</text>

  <!-- File rows -->
  <rect x="1092" y="252" width="296" height="40" rx="8" fill="#FFFFFF" stroke="#E1E7EC"/>
  <text x="1108" y="277" class="mono" font-size="12" fill="#0F1C24">src/billing/charge.ts</text>

  <rect x="1092" y="300" width="296" height="40" rx="8" fill="#FFFFFF" stroke="#E1E7EC"/>
  <text x="1108" y="325" class="mono" font-size="12" fill="#0F1C24">src/billing/invoices.ts</text>

  <rect x="1092" y="348" width="296" height="40" rx="8" fill="#FFFFFF" stroke="#E1E7EC"/>
  <text x="1108" y="373" class="mono" font-size="12" fill="#0F1C24">src/api/webhooks.ts</text>

  <rect x="1092" y="396" width="296" height="40" rx="8" fill="#FFFFFF" stroke="#E1E7EC"/>
  <text x="1108" y="421" class="mono" font-size="12" fill="#0F1C24">src/jobs/retryPayments.ts</text>

  <text x="1092" y="470" class="sans" font-size="12" fill="#5A6B76">What do you want to do?</text>

  <!-- CTAs -->
  <rect x="1092" y="488" width="140" height="40" rx="8" fill="#0F766E"/>
  <text x="1138" y="513" class="sans" font-size="14" font-weight="600" fill="#FFFFFF">Open</text>

  <rect x="1248" y="488" width="140" height="40" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="1272" y="513" class="sans" font-size="14" font-weight="600" fill="#0F766E">See impact</text>

  <text x="1092" y="560" class="sans" font-size="12" fill="#94A3B0">Open jumps to code. See impact shows blast radius.</text>
</svg>
