pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json}"
      exclude: '\.generated\.(ts|tsx|js|jsx|mjs|cjs)$'
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
    oxlint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      exclude: '\.generated\.(ts|tsx|js|jsx|mjs|cjs)$'
      run: bunx oxlint {staged_files}
